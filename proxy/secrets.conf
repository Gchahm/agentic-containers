# Secrets held by the ac-proxy container instead of the agent containers.
#
#   ENV_VAR   host[,host...]
#
# ENV_VAR is read from .env. Agent containers get ENV_VAR=ac-placeholder-ENV_VAR;
# the proxy swaps in the real value on HTTPS requests to the listed hosts only
# (exact name, or *.example.com for any subdomain). Vars that are empty or
# missing in .env are skipped.
#
# Apply changes with `ac proxy restart` (and `ac upgrade <name>` for containers
# that need a newly added variable).

GH_TOKEN   api.github.com,uploads.github.com,github.com,raw.githubusercontent.com

# Claude Code tokens set in .env. Leave commented if you use ANTHROPIC_BASE_URL
# with another host (list that host instead) or authenticate via `ac sync-auth`.
# CLAUDE_CODE_OAUTH_TOKEN   api.anthropic.com
# ANTHROPIC_AUTH_TOKEN      api.anthropic.com
# ANTHROPIC_API_KEY         api.anthropic.com
